version: 2

# 更新の時期の方針は design/tech-stack.md「更新の方針」節が正。
# - パッチ・マイナーは週次で、エコシステムごとに1本の PR にまとめる（groups）。
# - メジャーは自動 PR を止め、四半期の棚卸しで計画して上げる（ignore）。
# ignore の update-types と groups（既定の applies-to: version-updates）はどちらも
# version updates にだけ効くため、セキュリティ更新は従来どおり個別に届く。

updates:
  - package-ecosystem: gradle
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # pnpm も "npm" エコシステムで検出される（pnpm-lock.yaml を自動認識、pnpm 専用の
  # 値は存在しない）。pnpm workspace はリポジトリ直下にあるため directory は / とする。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm-workspace.yaml の minimumReleaseAge（7日）と揃える。揃えないと
    # Dependabot が公開7日未満のバージョンを提案し、その PR の
    # `pnpm install --frozen-lockfile` が ERR_PNPM_NO_MATURE_MATCHING_VERSION で
    # 失敗する（vim の design/tech-stack.md の実測記録）。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # release-please の版の上げ方に合わせる（design/tech-stack.md「リリースと版」）。
    # 本番の依存は fix(deps) で PATCH のリリースを作り、開発の依存は build(deps-dev) で
    # 版を上げずに次のリリースへ同乗させる。本番と開発が1本の PR に混ざったときの接頭辞は
    # 資料に記載が無いので、dependency-type でグループを分けて混ざらないようにする。
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope
    groups:
      npm-prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      npm-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions もサプライチェーン攻撃の経路になる。SHA 固定は「侵害された新しい版」の
    # 取り込みを防がないため、npm・gradle と同じ7日のクールダウンを置く。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # docker/ 配下の compose.yaml・compose.sonar.yaml のイメージタグ。
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
