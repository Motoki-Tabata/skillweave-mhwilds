name: Release

# 版とデプロイの規則の正は design/tech-stack.md「リリースと版」節。
# - main への push: release-please がリリース PR を作る・更新する。リリース PR をマージすると、
#   タグと GitHub Release を作り、同じ実行の中で Web を本番へ出す。
# - workflow_dispatch: 既存のタグを指定して Web を出し直す（前の版へ戻すときも使う）。
# GITHUB_TOKEN で作った PR とタグはワークフローを起動しないため（リリース PR の必須チェックが
# 走らない）、リリース PR は GitHub App のトークンで作る。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 出すタグ（例 v0.1.0）
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # main への push が続いても、リリース PR の更新を取り違えないよう順に実行する。
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-web:
    name: deploy-web
    needs: release-please
    # workflow_dispatch では release-please が skip されるので、!cancelled() で依存の skip を許す。
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://skillweave.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # 入力は式に直接埋め込まず、環境変数で受けてシェルへ渡す（スクリプト注入の対策）。
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::タグの形式が違う: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter @swv/web --filter './packages/*' run test:unit
      # e2e の後の dist は OCR の測定ページを含むので使わない。ここで新しくビルドする。
      - name: Build
        run: pnpm --filter @swv/web run build
      - name: Check measurement pages are excluded
        run: |
          found="$(find apps/web/dist -ipath '*charm-ocr*')"
          if [ -n "$found" ]; then
            echo "::error::dist に測定ページが含まれている"
            echo "$found"
            exit 1
          fi
      - name: Deploy (dry run)
        run: pnpm --filter @swv/web exec wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: pnpm --filter @swv/web exec wrangler deploy --tag "$RELEASE_TAG" --message "$RELEASE_TAG"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # 本番の応答の確認（design/tech-stack.md「Web のデプロイ手順」の表の自動化できる部分）。
      # /api/auth/me は、API の接続前は 503、接続後は Cookie が無いので Worker の 401 になる。
      - name: Smoke test
        run: |
          check() {
            local path="$1" expected="$2" accept="$3" result
            result="$(curl -sS -o /dev/null -H "Accept: $accept" -w '%{http_code} %{content_type}' --retry 3 --retry-all-errors "https://skillweave.app$path")"
            echo "$path -> $result"
            [[ "$result" =~ ^($expected) ]] || { echo "::error::$path の応答が想定外: $result"; return 1; }
          }
          check / '200 text/html' 'text/html'
          check /privacy '200 text/html' 'text/html'
          check /api/auth/me '401 application/problem\+json|503 application/problem\+json' 'application/json'
