# JVM の既定ヒープではテスト（Testcontainers 併用）に足りないため明示する。
# file.encoding は日本語コメント・日本語テスト名を含むソースの取り違えを防ぐ保険。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# ビルドキャッシュ（ローカル）。contractTest は inputs.dir(contracts) を宣言済みのため
# キャッシュに乗っても契約 YAML の変更は正しく検出される。
org.gradle.caching=true

# 環境固有の設定（例: JAVA_TOOL_OPTIONS 相当の回避策）はこのファイルに入れない。
# 各自の ~/.gradle/gradle.properties に置くこと（vim の specs/open-questions.md Q26 と同じ方針）。
