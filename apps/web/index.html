<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>装備検索 | SkillWeave</title>
    <!-- テーマはダークが既定。ライトを選んだ端末だけ、描画の前に dark を外す（読み込み直後に明るく光るのを防ぐ） -->
    <script>
      try {
        if (localStorage.getItem('swv-theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
      } catch {
        // ストレージが使えない環境では既定のダークのまま
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main/main.ts"></script>
  </body>
</html>
