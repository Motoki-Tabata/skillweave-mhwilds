openapi: 3.1.0
info:
  title: Skillweave for MH Wilds API
  description: |
    Skillweave for MH Wilds バックエンド API の契約。

    この YAML が契約の正（source of truth）である。実装（springdoc が実行時に
    出力する /v3/api-docs）はこの内容と一致するよう、apps/api の contract テスト
    （`./gradlew contractTest`）で突合される。運用ルールは README.md を参照。
  version: v0
servers:
  - url: http://localhost:8080
    description: ローカル開発環境（docker compose + ./gradlew bootRun）
tags:
  - name: auth
    description: 認証（Discord ログインで確立したセッションの参照とログアウト）
  - name: charms
    description: 護石（ログイン中のユーザーが保存する護石の一覧・作成・更新・削除）
  - name: builds
    description: 構成（ログイン中のユーザーが保存する構成の一覧・作成・名前の変更・削除）
  - name: weapons
    description: 個体差のある武器（ログイン中のユーザーが保存する個体差のある武器の一覧・作成・更新・削除）
  - name: shares
    description: 共有（ログイン中のユーザーが作る構成の共有の一覧・作成・取り消し）
  - name: shared-builds
    description: 共有された構成（短縮 ID で未ログインでも閲覧できる）
paths:
  /api/shares:
    $ref: paths/shares/shares.yaml
  /api/shares/{id}:
    $ref: paths/shares/shares-id.yaml
  /api/shared-builds/{shortId}:
    $ref: paths/shared-builds/shared-builds-shortId.yaml
  /api/builds:
    $ref: paths/builds/builds.yaml
  /api/builds/{id}:
    $ref: paths/builds/builds-id.yaml
  /api/charms:
    $ref: paths/charms/charms.yaml
  /api/charms/{id}:
    $ref: paths/charms/charms-id.yaml
  /api/weapons:
    $ref: paths/weapons/weapons.yaml
  /api/weapons/{id}:
    $ref: paths/weapons/weapons-id.yaml
  /api/auth/me:
    $ref: paths/auth/auth-me.yaml
  /api/auth/logout:
    $ref: paths/auth/auth-logout.yaml
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Discord ログイン後に発行されるセッション Cookie。
  schemas:
    CurrentUser:
      $ref: components/schemas/auth/CurrentUser.yaml
    ProblemDetail:
      $ref: components/schemas/common/ProblemDetail.yaml
    Charm:
      $ref: components/schemas/charms/Charm.yaml
    CharmPayload:
      $ref: components/schemas/charms/CharmPayload.yaml
    CharmSkill:
      $ref: components/schemas/charms/CharmSkill.yaml
    CharmSlot:
      $ref: components/schemas/charms/CharmSlot.yaml
    CreateCharmRequest:
      $ref: components/schemas/charms/CreateCharmRequest.yaml
    UpdateCharmRequest:
      $ref: components/schemas/charms/UpdateCharmRequest.yaml
    Build:
      $ref: components/schemas/builds/Build.yaml
    BuildPayload:
      $ref: components/schemas/builds/BuildPayload.yaml
    BuildWeapon:
      $ref: components/schemas/builds/BuildWeapon.yaml
    BuildMasterWeapon:
      $ref: components/schemas/builds/BuildMasterWeapon.yaml
    BuildCustomWeapon:
      $ref: components/schemas/builds/BuildCustomWeapon.yaml
    CustomWeaponPayload:
      $ref: components/schemas/builds/CustomWeaponPayload.yaml
    CustomWeapon:
      $ref: components/schemas/weapons/CustomWeapon.yaml
    CreateCustomWeaponRequest:
      $ref: components/schemas/weapons/CreateCustomWeaponRequest.yaml
    UpdateCustomWeaponRequest:
      $ref: components/schemas/weapons/UpdateCustomWeaponRequest.yaml
    BuildArmor:
      $ref: components/schemas/builds/BuildArmor.yaml
    BuildCharm:
      $ref: components/schemas/builds/BuildCharm.yaml
    BuildCraftedCharm:
      $ref: components/schemas/builds/BuildCraftedCharm.yaml
    BuildDecoration:
      $ref: components/schemas/builds/BuildDecoration.yaml
    BuildSlotRef:
      $ref: components/schemas/builds/BuildSlotRef.yaml
    BuildSkill:
      $ref: components/schemas/builds/BuildSkill.yaml
    CreateBuildRequest:
      $ref: components/schemas/builds/CreateBuildRequest.yaml
    RenameBuildRequest:
      $ref: components/schemas/builds/RenameBuildRequest.yaml
    Share:
      $ref: components/schemas/shares/Share.yaml
    CreateShareRequest:
      $ref: components/schemas/shares/CreateShareRequest.yaml
    SharedBuild:
      $ref: components/schemas/shares/SharedBuild.yaml
  responses:
    Unauthorized:
      $ref: components/responses/Unauthorized.yaml
    BadRequest:
      $ref: components/responses/BadRequest.yaml
    NotFound:
      $ref: components/responses/NotFound.yaml
    Conflict:
      $ref: components/responses/Conflict.yaml
