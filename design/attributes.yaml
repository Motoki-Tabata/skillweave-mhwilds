# Attribute（データ項目）辞書 — design/data-model-standard.md の「三層」節で定義される SSoT。
#
# 目的: 同じ項目が別テーブルで別の型・別の桁になる事故を防ぐ。項目ごとに
# 論理名・物理名・型・桁・NULL可否・ドメイン制約を一度だけ定義する。
#
# 運用: 機能が1つ TSOD で確定するたびに、その機能が扱う項目をここに追記する。
# 物理名・型は design/data-model-standard.md の命名規則に従うこと（区分カラムは text + CHECK、
# ENUM 型は使わない等）。最初のエントリは機能009（discord-login）で確定した
# （users テーブルの項目）。
#
# エントリ形式（論理名をキーにした map）:
#
#   <論理名（日本語可）>:
#     physical_name: <物理名（カラム名）。snake_case・単数形>
#     type: <PostgreSQL の型。例: text, integer, boolean, date, timestamptz, uuid, jsonb>
#     length: <桁数上限。text 型で制約する場合のみ。無制限なら省略可>
#     nullable: <true | false>
#     domain: <値の制約（CHECK 制約の内容）か参照先テーブル名。制約が無ければ省略可>
#     used_in: [<テーブル名.カラム名>, ...]  # 実際に登場する箇所。機能確定のたびに追記
#     defined_by: <specs/NNN-<slug> のうち、この項目を最初に確定した機能。未確定なら null>
#     note: <補足。任意>
#
# 例（記入イメージ。実エントリではない）:
#
#   所有者ID:
#     physical_name: user_id
#     type: uuid
#     nullable: false
#     domain: users (id)
#     used_in: [charms.user_id]
#     defined_by: null

version: 1
attributes:
  ユーザーID:
    physical_name: id
    type: uuid
    nullable: false
    domain: 主キー（DEFAULT uuidv7()）
    used_in: [users.id]
    defined_by: specs/009-discord-login
    note: users の主キー。サーバー採番。他テーブルからは「所有者ID」（user_id）で参照する

  Discord ユーザーID:
    physical_name: discord_id
    type: text
    length: 20
    nullable: false
    domain: "^[0-9]{1,20}$"・一意
    used_in: [users.discord_id]
    defined_by: specs/009-discord-login
    note: Discord のスノーフレーク。文字列で保持する

  作成日時:
    physical_name: created_at
    type: timestamptz
    nullable: false
    domain: DEFAULT now()・UTC
    used_in: [users.created_at, charms.created_at]
    defined_by: specs/009-discord-login

  更新日時:
    physical_name: updated_at
    type: timestamptz
    nullable: false
    domain: DEFAULT now()・UTC
    used_in: [users.updated_at, charms.updated_at]
    defined_by: specs/009-discord-login

  護石ID:
    physical_name: id
    type: uuid
    nullable: false
    domain: 主キー（DEFAULT uuidv7()）
    used_in: [charms.id]
    defined_by: specs/010-charm-save
    note: クライアント採番の UUIDv7。他ユーザー・削除済みの行との衝突は拒否する

  所有者ID:
    physical_name: user_id
    type: uuid
    nullable: false
    domain: users (id)
    used_in: [charms.user_id]
    defined_by: specs/010-charm-save

  内容:
    physical_name: payload
    type: jsonb
    nullable: false
    domain: JSON オブジェクト（jsonb_typeof = 'object'）
    used_in: [charms.payload]
    defined_by: specs/010-charm-save
    note: 形は schema_version で版管理する。charms は { rarity, skills: [{ skillId, level }], slots: [{ target, level }] }（構造の検査は API。マスターに依る検査は Web）

  スキーマ版:
    physical_name: schema_version
    type: integer
    nullable: false
    domain: 1 以上
    used_in: [charms.schema_version]
    defined_by: specs/010-charm-save
    note: payload の形の版。charms は 1

  行バージョン:
    physical_name: version
    type: integer
    nullable: false
    domain: DEFAULT 0
    used_in: [charms.version]
    defined_by: specs/010-charm-save
    note: 楽観的ロック（@Version）。競合判定に updated_at を使わない

  削除日時:
    physical_name: deleted_at
    type: timestamptz
    nullable: true
    domain: UTC。NULL が未削除
    used_in: [charms.deleted_at]
    defined_by: specs/010-charm-save
