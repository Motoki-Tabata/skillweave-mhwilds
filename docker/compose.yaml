# 開発用インフラ（PostgreSQL のみ。セッションも PostgreSQL に置くため Valkey は持たない）
#
# 使い方:
#   docker compose -f docker/compose.yaml up -d --wait
#   docker compose -f docker/compose.yaml ps
#   docker compose -f docker/compose.yaml down
#
# タイムゾーンは全レイヤ UTC に統一する（表示時にブラウザのローカル時刻へ変換する）。
# ホスト側ポートは 5433。同じマシンで vehicle-intake-management の PostgreSQL（5432）と
# 同時に起動できるようにするため。

name: swv

services:
  postgres:
    image: postgres:18.6-trixie
    container_name: swv_postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_DB: swv_db
      POSTGRES_USER: swv_app
      POSTGRES_PASSWORD: swv_app_password
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ の公式イメージは PGDATA を /var/lib/postgresql/<major>/docker に
      # 自動配置する方式に変更された。/var/lib/postgresql/data への直接マウントは
      # 起動時エラーになるため、親ディレクトリ /var/lib/postgresql を単一マウントする。
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swv_app -d swv_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
