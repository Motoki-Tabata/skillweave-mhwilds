# 火力計算用の発動条件とスキルの効果（006）。
# 数値の出典は、ゲーム内の説明文（ja の levelDescriptions）。説明文に数値が無い効果は、オーナーが採用した Web の情報源
# （名前のコメントに `（Web）`。出典の記録は design/master-data.md §11）。最終確認はオーナー。
# 条件はきっかけで決める。「スキル発動中」「効果発動時」などは、そのスキルの en の名前の snake_case。
# 効果の種類は decisions.md Q187 の表（攻撃力・会心率・会心倍率・属性値・状態異常値・防御力・耐性値）だけを書く。
# 属性値・状態異常値の加算はマスターの単位（説明文の値 ÷ 10）で書く。その他の値は説明文のまま。
# オトモ・回数や段階を数える数値・種類の区別が定まらない値・攻撃の種類や部位で範囲を限る倍率・数値の無い部分は書かない。
# 回数・ヒット数・経過時間で段階的に強まる効果は、最大の段階の値を 1 つの条件に入れる（条件の名前で最大の段階と分かるようにする）。
# 1 レベルの効果は、説明文に出てくる順（乗算→加算→他）に書く。

