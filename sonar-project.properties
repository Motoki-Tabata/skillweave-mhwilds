# ローカル限定の SonarQube 解析設定（scripts/sonar-local.sh から使う。CI では使わない）。
# 採用判断の経緯は design/tech-stack.md「SonarQube のローカル限定採用」節を参照。
#
# java.binaries / java.libraries / java.jdkHome はビルド結果に依存するため、
# scripts/sonar-local.sh がコマンドライン引数で渡す。

sonar.projectKey=swv
sonar.projectName=skillweave-mhwilds
sonar.sourceEncoding=UTF-8
# 作業領域はスクリプトが .sonar-local/scannerwork を絶対パスで指定する（スキャナイメージの既定を上書きするため）
sonar.scm.provider=git

# 本体コードと、IDE（SonarQube for IDE）でも解析対象になる設定ファイル群
sonar.sources=apps/api/src/main,\
  apps/web/src/main,\
  apps/web/scripts,\
  apps/web/eslint.config.ts,\
  apps/web/vite.config.ts,\
  apps/web/vitest.config.ts,\
  apps/web/index.html,\
  packages/solver/src/main,\
  packages/data/src/main
sonar.tests=apps/api/src/test,\
  apps/web/src/test,\
  packages/solver/src/test,\
  packages/data/src/test

sonar.java.source=25
sonar.typescript.tsconfigPaths=apps/web/tsconfig.app.json,\
  apps/web/tsconfig.vitest.json,\
  apps/web/tsconfig.node.json,\
  packages/solver/tsconfig.json,\
  packages/solver/tsconfig.vitest.json,\
  packages/data/tsconfig.json

# 生成物（contracts/openapi.yaml から pnpm contract:types で再生成する）は解析しない
sonar.exclusions=apps/web/src/main/lib/api/schema.ts

# カバレッジ（scripts/sonar-local.sh が直前にテストを走らせて生成する）。
sonar.coverage.jacoco.xmlReportPaths=apps/api/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,\
  packages/solver/coverage/lcov.info,\
  packages/data/coverage/lcov.info
# shadcn-vue からソースとしてコピーした汎用部品は、自前コードの実態を測るためカバレッジの
# 集計から外す（静的解析の対象には残す。apps/web/vitest.config.ts の coverage.exclude と揃える）。
# main.ts・App.vue はブートストラップ・配線のみのため同様に除外する（apps/web/vitest.config.ts と揃える）。
# build-swagger-ui.mjs は生成用スクリプト（CI の contract:swagger 実行で疎通を担保）、
# SkillweaveApplication.java は main と TimeZone 設定のみのためこちらでだけ除外する。
sonar.coverage.exclusions=apps/web/src/main/components/ui/**,\
  apps/web/src/main/main.ts,\
  apps/web/src/main/App.vue,\
  apps/web/scripts/build-swagger-ui.mjs,\
  apps/api/src/main/java/io/github/motokitabata/skillweave/SkillweaveApplication.java

# 誤検知の抑止（sonar.issue.ignore.multicriteria）は、修正を先に検討し、抑止する場合は
# ユーザーの承認を得てから1件ごとに理由コメントを付けてここへ追記する。ソースへの // NOSONAR は使わない。
sonar.issue.ignore.multicriteria=e1,e2,e3
# e1: shadcn-vue のコピー（手で編集しない）の汎用 Input。ラベルは利用側（Label for・aria-label）が付けるため、部品の単体では解決できない誤検知（機能004 区間 D・承認済み）。
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/web/src/main/components/ui/input/Input.vue
# e2: shadcn-vue のコピーの汎用 Label。for は利用側が渡す（reka-ui の Label に属性を委譲している）ため誤検知（同上）。
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/web/src/main/components/ui/label/Label.vue
# e3: Reka UI の SelectTrigger（button）に aria-label と Label for の両方を付けているが、Sonar がコンポーネントを追えず指摘する誤検知（同上）。
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=apps/web/src/main/components/search/RequiredSkillsCard.vue
